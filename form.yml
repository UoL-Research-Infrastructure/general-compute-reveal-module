---
cluster:
  - "pilot-slurm"
form:
  - auto_groups
  - bc_num_hours
  - bc_num_slots
  - custom_memory_per_node
  - custom_num_cores
  - custom_queue
  - bc_vnc_resolution
  - bc_email_on_started
attributes:
  auto_groups:
    label: Group
  bc_email_on_started: ''
  bc_num_slots: "1"
  bc_num_hours:
    cacheable: false
    value: 1
  custom_queue:
    label: Queue
    options:
    -   - Default
        - general
    widget: select
  custom_memory_per_node:
    cacheable: false
    label: "Memory required in GB"
    value: 8
    min:   8
    max:   8
    widget: number_field
  custom_num_cores:
    cacheable: false
    label: "Number of cores"
    value: 4
    min:   4
    max:   4
    help: |
      Number of cores per task
    widget: number_field
  bc_vnc_resolution:
    cacheable: false
    required: true
